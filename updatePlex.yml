---
  - name: Update plex if no active streams
    hosts: plex
    strategy: free
    gather_facts: true
    become: true
    vars_files: ~/ansible/secrets/plex_vars.yml


    tasks:

      - name: "Determine streams currently playing"
        shell: "/usr/bin/curl -s http://localhost:32400/status/sessions?X-Plex-Token={{ plex_token }} | grep \"Player\" | wc -l"
        register: stream_count

      - name: "Update repo cache & full system update"
        when: stream_count.stdout is search("0")
        apt:
          update_cache: true
          upgrade: dist
          force_apt_get: true

      - name: "Reboot plex server"
        when: stream_count.stdout is search("0")
        ansible.builtin.reboot:

      - name: "Apt Autoremove"
        when: stream_count.stdout is search("0")
        apt:
          autoremove: yes

      - name: "Reboot once more after removing old kernel"
        when: stream_count.stdout is search("0")
        ansible.builtin.reboot:

      - name: Create backup directory
        ansible.builtin.file:
          path: "/mnt/backups/plex/{{ ansible_date_time.date }}"
          state: directory
          mode: '0777'
        delegate_to: localhost

      - name: Backup plex data
        synchronize:
          src: "/var/lib/plexmediaserver/Library/Application Support/Plex Media Server/" # remote host
          dest: "/mnt/backups/plex/{{ ansible_date_time.date }}/" # localhost
          mode: pull
          recursive: true
          rsync_path: "sudo -u plex rsync"
        become: false

