services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: /docker/uptime-kuma/nginx.conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - uptime-kuma
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    volumes:
      - /docker/uptime-kuma/data:/app/data
    ports:
      # <Host Port>:<Container Port>
      - 3001:3001
    restart: unless-stopped
